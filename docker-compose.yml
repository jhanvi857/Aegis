
networks:
  aegis-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  # ─────────────────────────────────────────────────────────────
  # Infrastructure Services
  # ─────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aegis-zookeeper
    profiles: ["full"]
    networks:
      - aegis-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aegis-kafka
    profiles: ["full"]
    networks:
      - aegis-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7.2-alpine
    container_name: aegis-redis
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    profiles: ["core", "full"]
    networks:
      - aegis-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set in .env}
      POSTGRES_DB: aegis_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5

  # ─────────────────────────────────────────────────────────────
  # Playground Distributed Services
  # ─────────────────────────────────────────────────────────────

  gateway:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: playground/gateway
    container_name: aegis-gateway
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
      ENABLE_SYNTHETIC_LOAD: "false"
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro
    depends_on:
      - node-a
      - node-b
      - node-c
      - node-d

  node-a:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: playground/node-a
    container_name: aegis-node-a
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8081:8081"
    environment:
      NODE_ID: "node-a"
      PORT: "8081"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro

  node-b:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: playground/node-b
    container_name: aegis-node-b
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8082:8082"
    environment:
      NODE_ID: "node-b"
      PORT: "8082"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro

  node-c:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: playground/node-c
    container_name: aegis-node-c
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8083:8083"
    environment:
      NODE_ID: "node-c"
      PORT: "8083"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro

  node-d:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: playground/node-d
    container_name: aegis-node-d
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8084:8084"
    environment:
      NODE_ID: "node-d"
      PORT: "8084"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro

  # ─────────────────────────────────────────────────────────────
  # Control Plane & Intelligence Services
  # ─────────────────────────────────────────────────────────────

  chaos-engine:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: chaos-engine
    container_name: aegis-chaos-engine
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8091:8091"
    environment:
      PORT: "8091"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro
    depends_on:
      - gateway
      - node-a
      - node-b
      - node-c
      - node-d

  telemetry-agent:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: telemetry-agent
    container_name: aegis-telemetry-agent
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      - kafka
      - gateway
      - node-a
      - node-b
      - node-c
      - node-d

  recovery-engine:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: recovery-engine
    container_name: aegis-recovery-engine
    profiles: ["full"]
    networks:
      - aegis-net
    ports:
      - "8092:8092"
    environment:
      PORT: "8092"
      PYTHON_GRPC_ADDR: "python-ml:50051"
    depends_on:
      - python-ml

  python-ml:
    build:
      context: .
      dockerfile: python-ml/Dockerfile
    container_name: aegis-python-ml
    profiles: ["core", "full"]
    networks:
      - aegis-net
    ports:
      - "50051:50051"
    environment:
      PORT: "50051"
      TOPOLOGY_PATH: /app/configs/topology.yaml
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      AEGIS_TORCH_NUM_THREADS: ${AEGIS_TORCH_NUM_THREADS:-2}
      AEGIS_CHECKPOINT_PATH: /app/python-ml/models/checkpoints/tgnn_best.pt
    volumes:
      - ./configs/topology.yaml:/app/configs/topology.yaml:ro
      - ./python-ml/models/checkpoints:/app/python-ml/models/checkpoints:ro
    mem_limit: 2g
    cpus: 2

  api-gateway:
    build:
      context: ./go-services
      dockerfile: playground/Dockerfile
      args:
        SERVICE_DIR: api-gateway
    container_name: aegis-api-gateway
    profiles: ["core", "full"]
    networks:
      - aegis-net
    ports:
      - "8000:8000"
    environment:
      API_GATEWAY_PORT: "8000"
      TOPOLOGY_PATH: /etc/aegis/topology.yaml
      PYTHON_GRPC_ADDR: "python-ml:50051"
      CHAOS_ENGINE_URL: "http://chaos-engine:8091"
      RECOVERY_ENGINE_URL: "http://recovery-engine:8092"
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis_db?sslmode=disable
      AEGIS_BOOTSTRAP_ADMIN_EMAIL: ${AEGIS_BOOTSTRAP_ADMIN_EMAIL:-admin@enterprise.io}
      AEGIS_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:?AEGIS_BOOTSTRAP_ADMIN_PASSWORD environment variable must be set in .env}
    volumes:
      - ./configs/topology.yaml:/etc/aegis/topology.yaml:ro
    depends_on:
      - postgres
      - python-ml
    mem_limit: 512m
    cpus: 1

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aegis-frontend
    profiles: ["core", "full"]
    networks:
      - aegis-net
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    mem_limit: 256m
    cpus: 0.5
