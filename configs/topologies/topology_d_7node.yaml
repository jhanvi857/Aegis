version: "1.0"
system_name: "aegis-topology-d"
description: "7-node diamond cross-coupled microservice topology (unseen test set)"

nodes:
  - id: "ingress-lb"
    name: "Ingress Load Balancer"
    type: "gateway"
    host: "ingress-lb"
    port: 8080
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies:
      - "router-1"
      - "router-2"
    metadata:
      role: "load-balancer"
      tier: "edge"

  - id: "router-1"
    name: "Routing Node 1"
    type: "service"
    host: "router-1"
    port: 8081
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies:
      - "worker-alpha"
      - "worker-beta"
    metadata:
      role: "traffic-router"
      tier: "routing"

  - id: "router-2"
    name: "Routing Node 2"
    type: "service"
    host: "router-2"
    port: 8082
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies:
      - "worker-alpha"
      - "worker-beta"
    metadata:
      role: "traffic-router"
      tier: "routing"

  - id: "worker-alpha"
    name: "Worker Cluster Alpha"
    type: "service"
    host: "worker-alpha"
    port: 8083
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies:
      - "shared-cache"
      - "db-cluster"
    metadata:
      role: "worker"
      tier: "compute"

  - id: "worker-beta"
    name: "Worker Cluster Beta"
    type: "service"
    host: "worker-beta"
    port: 8084
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies:
      - "shared-cache"
      - "db-cluster"
    metadata:
      role: "worker"
      tier: "compute"

  - id: "shared-cache"
    name: "Shared Redis Cache"
    type: "database"
    host: "shared-cache"
    port: 8085
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies: []
    metadata:
      role: "cache"
      tier: "caching"

  - id: "db-cluster"
    name: "Postgres Sharded DB"
    type: "database"
    host: "db-cluster"
    port: 8086
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    dependencies: []
    metadata:
      role: "persistence"
      tier: "database"
