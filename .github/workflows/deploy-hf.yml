name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/hf/**
      - frontend/**
      - go-services/**
      - python-ml/**
      - proto/**
      - configs/**

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_SPACE_ID"

      - name: Publish Space source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          git config user.name "Aegis deployment"
          git config user.email "actions@users.noreply.github.com"
          cat deploy/hf/space-header.md README.md > /tmp/aegis-space-readme.md
          mv /tmp/aegis-space-readme.md README.md
          git add README.md
          git commit -m "space metadata"
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git"
          git fetch space main || true
          git push --force space HEAD:main
